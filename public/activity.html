<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Activity — TARSCO Robotics</title><link rel="icon" href="/assets/trc-roundel.webp"><link rel="stylesheet" href="/assets/trc-brand.css?v=20261123-1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#071b11;color:#f1f5ee;font-family:Inter,sans-serif}.wrap{max-width:850px;margin:auto;padding:96px 20px 50px}.muted{color:#9ab09d}.panel{background:#0c2818;border:1px solid #285438;border-radius:12px;padding:18px;margin:12px 0}.kind{color:#e8be16;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}.panel p{line-height:1.55;white-space:pre-wrap}.panel a{color:#e8be16;text-decoration:none}.empty{text-align:center;padding:35px;color:#9ab09d}</style>  <link rel="stylesheet" href="assets/trc-motion.css">
</head><body><nav class="trc-site-nav trc-page-nav"><a href="/dashboard.html">TARSCO Robotics</a><div><a href="/members.html">Members</a>　<a href="/calendar.html">Calendar</a>　<a href="/profile.html">Profile</a></div></nav><main class="wrap"><h1 style="font:700 2.5rem Rajdhani;margin:0">Club activity</h1><p class="muted">Recent learning milestones, community conversations and approved projects.</p><div id="status" class="muted">Loading activity…</div><section id="feed"></section></main><script>
const token=localStorage.getItem('trc_token'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function date(v){const d=new Date(v);return isNaN(d)?'':d.toLocaleString();}(async()=>{if(!token){location.href='/login.html?next=activity';return;}try{const r=await fetch('/api/activity',{headers:{Authorization:'Bearer '+token}});if(r.status===401){localStorage.removeItem('trc_token');location.href='/login.html?next=activity';return;}const data=await r.json();if(!r.ok)throw Error(data.message||'Could not load activity');$('status').textContent=data.length+' recent updates';$('feed').innerHTML=data.length?data.map(a=>'<article class="panel"><div class="kind">'+esc(a.kind)+'</div><strong>'+esc(a.actor)+'</strong> <span class="muted">'+esc(a.text)+'</span><p>'+esc(a.detail)+'</p><div class="muted">'+esc(date(a.date))+' · <a href="'+esc(a.href)+'">View activity →</a></div></article>').join(''):'<div class="empty">There is no recent club activity yet. Check back after members share updates.</div>';}catch(e){$('status').textContent=e.message;}})();
</script>  <script src="assets/trc-motion.js" defer></script>
</body></html>
