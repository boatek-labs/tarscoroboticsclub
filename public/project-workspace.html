<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071B11"><link rel="icon" href="/assets/trc-roundel.webp"><title>Project Workspace — TARSCO Robotics</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#071b11;color:#f1f5ee;font-family:Inter,sans-serif}.wrap{max-width:1100px;margin:auto;padding:34px 18px}.muted{color:#91a895}.panel{background:#0c2818;border:1px solid #285438;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.task{padding:13px;border:1px solid #365b42;border-radius:9px;margin:9px 0}.task select,.field{background:#071b11;color:#f1f5ee;border:1px solid #365b42;border-radius:7px;padding:10px;font:inherit}.field{width:100%;margin:6px 0}.btn{background:#e8be16;color:#071b11;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col{background:#081e12;border:1px solid #285438;border-radius:10px;padding:12px;min-width:0}.comment{border-top:1px solid #285438;padding:10px 0;white-space:pre-wrap}.member{display:inline-flex;align-items:center;gap:7px;margin:5px 10px 5px 0}.avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#214b31;display:grid;place-items:center;color:#e8be16}@media(max-width:720px){.grid,.columns{grid-template-columns:1fr}}</style></head><body><nav style="padding:15px 20px;background:#0c2818;border-bottom:1px solid #285438"><a href="/dashboard.html" style="color:#e8be16;text-decoration:none">← Dashboard</a>　<a href="/my-projects.html" style="color:#e8be16;text-decoration:none">My Projects</a>　<a href="/messages.html" style="color:#e8be16;text-decoration:none">Messages</a></nav><main class="wrap"><div id="status" class="muted">Loading project workspace…</div><section id="workspace" hidden><div class="panel"><div class="muted" id="project-status"></div><h1 id="title" style="font:700 2.3rem Rajdhani;margin:5px 0"></h1><p id="description" class="muted"></p><h3 style="font:700 1.2rem Rajdhani">Team</h3><div id="members"></div></div><section class="panel"><h2 style="font:700 1.5rem Rajdhani">Task board</h2><form id="task-form"><input id="task-title" class="field" placeholder="What needs to be done?" maxlength="140" required><textarea id="task-desc" class="field" placeholder="Task details (optional)" maxlength="1000" rows="2"></textarea><select id="assignee" class="field"><option value="">Unassigned</option></select><button class="btn">Add task</button></form><div class="columns" id="board"></div></section><section class="panel"><h2 style="font:700 1.5rem Rajdhani">Team discussion</h2><form id="comment-form"><textarea id="comment-body" class="field" rows="3" maxlength="3000" placeholder="Share an update with your team…" required></textarea><button class="btn">Post update</button></form><div id="comments"></div></section><section class="panel"><h2 style="font:700 1.2rem Rajdhani">Add a teammate</h2><p class="muted">Enter the account ID of an existing club member.</p><input id="invite-id" class="field" placeholder="Member account ID"><button class="btn" id="invite">Add teammate</button></section></section></main><script>
const token=localStorage.getItem('trc_token'),id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};let data;async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...headers,...opts.headers},cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('trc_token');location.href='/login.html';}if(!r.ok)throw Error(d.message||'Request failed');return d;}function draw(){const p=data.project;$('title').textContent=p.title||'Project workspace';$('description').textContent=p.description||'No project description.';$('project-status').textContent='PROJECT · '+p.status.toUpperCase();$('members').innerHTML=data.members.map(m=>'<span class="member"><span class="avatar">'+esc((m.name||'?')[0])+'</span>'+esc(m.name)+' <small class="muted">'+esc(m.role)+'</small></span>').join('');$('assignee').innerHTML='<option value="">Unassigned</option>'+data.members.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('');const statuses=[['todo','To do'],['in-progress','In progress'],['done','Done']];$('board').innerHTML=statuses.map(([key,label])=>'<div class="col"><h3 style="font:700 1.1rem Rajdhani">'+label+' ('+data.tasks.filter(t=>t.status===key).length+')</h3>'+data.tasks.filter(t=>t.status===key).map(t=>'<article class="task"><strong>'+esc(t.title)+'</strong><p class="muted">'+esc(t.description)+'</p><select data-task="'+esc(t.id)+'" class="field">'+statuses.map(([v,l])=>'<option value="'+v+'" '+(t.status===v?'selected':'')+'>'+l+'</option>').join('')+'</select><button class="muted" data-delete="'+esc(t.id)+'" style="background:none;border:0;cursor:pointer">Remove</button></article>').join('')+'</div>').join('');$('comments').innerHTML=data.comments.length?data.comments.map(c=>'<div class="comment"><strong>'+esc(c.author?.name||'Team member')+'</strong><div class="muted">'+esc(new Date(c.createdAt).toLocaleString())+'</div><p>'+esc(c.body)+'</p></div>').join(''):'<p class="muted">No team updates yet.</p>';document.querySelectorAll('[data-task]').forEach(el=>el.onchange=async()=>{try{await api('/api/projects/'+id+'/tasks/'+el.dataset.task,{method:'PATCH',body:JSON.stringify({status:el.value})});await load();}catch(e){alert(e.message);}});document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=async()=>{if(!confirm('Remove this task?'))return;try{await api('/api/projects/'+id+'/tasks/'+el.dataset.delete,{method:'DELETE'});await load();}catch(e){alert(e.message);}});}async function load(){data=await api('/api/projects/'+encodeURIComponent(id)+'/workspace');draw();$('workspace').hidden=false;$('status').textContent='';}if(!token){location.href='/login.html';}else if(!id){$('status').textContent='A project ID is required in the page address.';}else load().catch(e=>$('status').textContent=e.message);$('task-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/projects/'+id+'/tasks',{method:'POST',body:JSON.stringify({title:$('task-title').value,description:$('task-desc').value,assigneeId:$('assignee').value})});$('task-form').reset();await load();}catch(e){alert(e.message);}};$('comment-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/projects/'+id+'/comment',{method:'POST',body:JSON.stringify({body:$('comment-body').value})});$('comment-form').reset();await load();}catch(e){alert(e.message);}};$('invite').onclick=async()=>{try{await api('/api/projects/'+id+'/team',{method:'POST',body:JSON.stringify({userId:$('invite-id').value.trim()})});$('invite-id').value='';await load();alert('Teammate added.');}catch(e){alert(e.message);}};
</script></body></html>
