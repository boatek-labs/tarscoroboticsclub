<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Calendar — TARSCO Robotics</title><link rel="icon" href="/assets/trc-roundel.webp"><link rel="stylesheet" href="/assets/trc-brand.css?v=20261123-1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#071b11;color:#f1f5ee;font-family:Inter,sans-serif}.wrap{max-width:1000px;margin:auto;padding:96px 20px 50px}.muted{color:#9ab09d}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}.btn{background:transparent;color:#f1f5ee;border:1px solid #477452;border-radius:7px;padding:9px 13px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:100px;background:#0c2818;border:1px solid #285438;border-radius:8px;padding:8px;min-width:0}.day small{color:#9ab09d}.event{display:block;margin-top:7px;padding:6px;background:#214b31;border-left:3px solid #e8be16;border-radius:4px;font-size:.72rem;overflow-wrap:anywhere}.week{font-size:.75rem;color:#e8be16;text-align:center;padding:8px}.list{margin-top:22px}.item{background:#0c2818;border:1px solid #285438;border-radius:10px;padding:15px;margin:9px 0}.empty{padding:30px;text-align:center;color:#9ab09d}@media(max-width:600px){.day{min-height:72px;padding:4px}.event{font-size:.6rem;padding:3px}.grid{gap:3px}}</style></head><body><nav class="trc-site-nav trc-page-nav"><a href="/dashboard.html">TARSCO Robotics</a><div><a href="/members.html">Members</a>　<a href="/activity.html">Activity</a>　<a href="/profile.html">Profile</a></div></nav><main class="wrap"><h1 style="font:700 2.5rem Rajdhani;margin:0">Club calendar</h1><p class="muted">Upcoming robotics sessions, meetings, competitions and announcements.</p><div class="toolbar"><button class="btn" id="prev">← Previous</button><strong id="month"></strong><button class="btn" id="next">Next →</button></div><div class="grid" id="calendar"></div><h2 style="font:700 1.5rem Rajdhani;margin-top:28px">Upcoming events</h2><div id="events" class="list muted">Loading events…</div></main><script>
const $=id=>document.getElementById(id);let cursor=new Date();cursor.setDate(1);let events=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();$('month').textContent=cursor.toLocaleDateString(undefined,{month:'long',year:'numeric'});const cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="week">'+x+'</div>');for(let i=0;i<offset;i++)cells.push('<div class="day"></div>');for(let d=1;d<=days;d++){const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const matches=events.filter(e=>e.date&&new Date(e.date).getFullYear()===y&&new Date(e.date).getMonth()===m&&new Date(e.date).getDate()===d);cells.push('<div class="day"><small>'+d+'</small>'+matches.map(e=>'<span class="event">'+esc(e.title||'Club event')+'</span>').join('')+'</div>');}$('calendar').innerHTML=cells.join('');}async function init(){try{const r=await fetch('/api/events');events=await r.json();if(!r.ok)throw Error('Could not load events');render();const upcoming=events.filter(e=>e.date&&new Date(e.date)>=new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date));$('events').innerHTML=upcoming.length?upcoming.map(e=>'<article class="item"><strong>'+esc(e.title||'Club event')+'</strong><p class="muted">'+esc(new Date(e.date).toLocaleString())+(e.location?' · '+esc(e.location):'')+'</p>'+(e.description?'<div>'+esc(e.description)+'</div>':'')+'</article>').join(''):'<div class="empty">No upcoming events have been published.</div>';}catch(e){$('events').textContent=e.message;}}$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render();};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render();};init();
</script></body></html>
