<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071B11"><link rel="icon" href="/assets/trc-roundel.webp"><title>Messages — TARSCO Robotics Club</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#071b11;color:#f1f5ee;font-family:Inter,sans-serif;height:100dvh;display:flex;flex-direction:column}.top{height:60px;flex-shrink:0;background:#0c2818;border-bottom:1px solid #285438;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top a{color:#e8be16;text-decoration:none}.layout{flex:1;min-height:0;display:grid;grid-template-columns:310px 1fr}.side{border-right:1px solid #285438;display:flex;flex-direction:column;min-height:0}.search{padding:12px;border-bottom:1px solid #285438}.search input,.compose textarea,.newbox input{width:100%;background:#071b11;border:1px solid #365b42;color:#f1f5ee;border-radius:8px;padding:11px;font:inherit;outline:none}.list{overflow:auto}.conv{padding:13px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #285438;cursor:pointer}.conv.active,.conv:hover{background:#153b25}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#214b31;display:grid;place-items:center;color:#e8be16;font-weight:700;flex-shrink:0}.muted{color:#91a895;font-size:.78rem}.main{display:flex;flex-direction:column;min-height:0}.head{height:60px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #285438;background:#0c2818}.thread{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.row{display:flex}.row.me{justify-content:flex-end}.bubble{max-width:min(75%,620px);padding:10px 13px;border-radius:12px;background:#0c2818;border:1px solid #285438;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.me .bubble{background:#263d18;border-color:#6b611d}.time{font-size:.65rem;color:#91a895;margin-top:4px}.compose{padding:12px;border-top:1px solid #285438;background:#0c2818;display:flex;gap:10px;align-items:end}.compose textarea{resize:none;min-height:44px;max-height:120px}.btn{border:0;border-radius:8px;background:#e8be16;color:#071b11;font-weight:700;padding:12px 16px;cursor:pointer}.empty{margin:auto;text-align:center;color:#91a895;padding:25px}.newbox{padding:12px;border-bottom:1px solid #285438;display:none}.newbox button{margin-top:8px}.badge{background:#e8be16;color:#071b11;border-radius:20px;padding:2px 7px;font-size:.65rem}@media(max-width:650px){.layout{grid-template-columns:105px 1fr}.conv{padding:10px 7px;gap:5px;flex-direction:column;text-align:center}.conv .detail{width:100%;overflow:hidden}.conv .detail div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bubble{max-width:90%}.top{padding:0 10px}.muted.hide{display:none}}</style>  <link rel="stylesheet" href="assets/trc-motion.css">
</head><body><header class="top"><div><a href="/dashboard.html">← Dashboard</a>　<strong>Messages</strong></div><button class="btn" id="new">New message</button></header><div class="layout"><aside class="side"><div class="search"><input id="filter" placeholder="Search chats…" aria-label="Search conversations"></div><div class="newbox" id="newbox"><input id="member-search" placeholder="Search club members"><div id="member-results"></div></div><div class="list" id="conversations"><div class="empty">Loading conversations…</div></div></aside><main class="main"><div class="head" id="chat-head">Select a conversation</div><div class="thread" id="thread"><div class="empty">Choose a conversation or start a new message.</div></div><form class="compose" id="form"><textarea id="body" placeholder="Write a message…" maxlength="4000" required disabled></textarea><button class="btn" id="send" disabled aria-label="Send message"><i class="fa-solid fa-paper-plane"></i></button></form></main></div><script>
const token=localStorage.getItem('trc_token'),$=id=>document.getElementById(id);let conversations=[],active=null,poll=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...headers,...opts.headers},cache:'no-store'});if(r.status===401){localStorage.removeItem('trc_token');localStorage.removeItem('trc_user');location.href='/login.html?next=messages';throw Error('Session expired');}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d;}function avatar(u){const src=u?.avatarDataUrl||u?.picture||u?.avatar;return src?'<img class="avatar" src="'+esc(src)+'" alt="">':'<div class="avatar">'+esc((u?.name||'?').charAt(0).toUpperCase())+'</div>';}function renderList(){const q=$('filter').value.toLowerCase();const items=conversations.filter(c=>(c.partnerUser?.name||'').toLowerCase().includes(q));$('conversations').innerHTML=items.length?items.map(c=>'<div class="conv '+(active===c.partnerId?'active':'')+'" data-id="'+esc(c.partnerId)+'">'+avatar(c.partnerUser)+'<div class="detail" style="min-width:0;flex:1"><div style="font-weight:600;font-size:.86rem">'+esc(c.partnerUser?.name||'Member')+(c.unreadCount?'<span class="badge"> '+c.unreadCount+'</span>':'')+'</div><div class="muted">'+esc(c.lastMessage?.body||'Start a conversation')+'</div></div></div>').join(''):'<div class="empty">No conversations yet.</div>';document.querySelectorAll('.conv').forEach(el=>el.onclick=()=>openThread(el.dataset.id));}async function loadConversations(){conversations=await api('/api/messages');renderList();}async function openThread(id){active=id;const conv=conversations.find(c=>c.partnerId===id);$('chat-head').innerHTML=avatar(conv?.partnerUser)+'<div style="margin-left:10px"><strong>'+esc(conv?.partnerUser?.name||'Member')+'</strong><div class="muted">Direct conversation</div></div>';$('body').disabled=false;$('send').disabled=false;renderList();await loadThread();}async function loadThread(){if(!active)return;const thread=await api('/api/messages/'+encodeURIComponent(active));$('thread').innerHTML=thread.length?thread.map(m=>'<div class="row '+(m.fromUserId===myId?'me':'')+'"><div><div class="bubble">'+esc(m.body)+'</div><div class="time">'+esc(new Date(m.sentAt).toLocaleString())+(m.fromUserId===myId?(m.readAt?' · Read':' · Sent'):'')+'</div></div></div>').join(''):'<div class="empty">No messages yet. Say hello.</div>';$('thread').scrollTop=$('thread').scrollHeight;const c=conversations.find(x=>x.partnerId===active);if(c)c.unreadCount=0;renderList();}let myId='';async function init(){if(!token){location.href='/login.html?next=messages';return;}try{const user=await api('/api/users/me');myId=user.id;await loadConversations();const wanted=new URLSearchParams(location.search).get('user');if(wanted){let c=conversations.find(x=>x.partnerId===wanted);if(!c){const u=await api('/api/users/'+encodeURIComponent(wanted));c={partnerId:u.id,partnerUser:u,lastMessage:null,unreadCount:0};conversations.unshift(c);}await openThread(wanted);}else if(conversations[0])await openThread(conversations[0].partnerId);poll=setInterval(async()=>{try{await loadConversations();if(active)await loadThread();}catch{}},8000);}catch(e){$('conversations').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}$('form').onsubmit=async e=>{e.preventDefault();const body=$('body').value.trim();if(!body||!active)return;const b=$('send');b.disabled=true;try{await api('/api/messages/'+encodeURIComponent(active),{method:'POST',body:JSON.stringify({body})});$('body').value='';await loadConversations();await loadThread();}catch(e){alert(e.message);}finally{b.disabled=false;}};$('new').onclick=()=>{$('newbox').style.display=$('newbox').style.display==='block'?'none':'block';$('member-search').focus();};let searchTimer;$('member-search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{const list=await api('/api/members?q='+encodeURIComponent($('member-search').value));$('member-results').innerHTML=list.map(u=>'<div class="conv" data-user="'+esc(u.id)+'">'+avatar(u)+'<span>'+esc(u.name)+'</span></div>').join('')||'<div class="muted">No members found.</div>';document.querySelectorAll('[data-user]').forEach(el=>el.onclick=async()=>{let c=conversations.find(x=>x.partnerId===el.dataset.user);if(!c){const u=list.find(x=>x.id===el.dataset.user);c={partnerId:u.id,partnerUser:u,lastMessage:null,unreadCount:0};conversations.unshift(c);}await openThread(c.partnerId);$('newbox').style.display='none';});}catch(e){$('member-results').textContent=e.message;}},250);};$('filter').oninput=renderList;init();
</script>  <script src="assets/trc-motion.js" defer></script>
</body></html>
