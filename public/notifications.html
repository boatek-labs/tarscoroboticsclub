<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — TARSCO Robotics</title><meta name="description" content="Your TARSCO Robotics Club account notifications."><link rel="icon" href="/assets/trc-roundel.webp"><link rel="apple-touch-icon" href="/assets/trc-roundel.webp"><link rel="stylesheet" href="/assets/trc-brand.css?v=20261123-1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#071b11;color:#f1f5ee;font-family:Inter,sans-serif}.wrap{max-width:820px;margin:0 auto;padding:92px 20px 56px}.panel{background:#0c2818;border:1px solid #285438;border-radius:12px;padding:20px}.row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #285438;cursor:pointer}.row:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:#e8be16;margin-top:7px;flex:none}.row.read .dot{background:#52705a}.muted{color:#9ab09d;font-size:.85rem}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button,.btn{background:transparent;border:1px solid #477452;border-radius:7px;color:#edf4ec;padding:9px 13px;cursor:pointer}.filters button.active,.btn.primary{background:#e8be16;color:#071b11;border-color:#e8be16;font-weight:700}.empty{text-align:center;padding:36px;color:#9ab09d}a{color:#e8be16}
</style></head><body><nav class="trc-site-nav trc-page-nav"><a href="/dashboard.html">TARSCO Robotics</a><div><a href="/dashboard.html">Dashboard</a>　<a href="/profile.html">Profile</a></div></nav>
<main class="wrap"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px"><div><h1 style="font:700 2rem Rajdhani;margin:0">Notifications</h1><p id="count" class="muted">Loading your notifications…</p></div><button class="btn" id="markAll">Mark all as read</button></div><div class="filters" style="margin-bottom:14px"><button class="active" data-filter="all">All</button><button data-filter="unread">Unread</button><button data-filter="read">Read</button></div><section class="panel"><div id="list" class="muted">Loading…</div></section></main>
<script>
const token=localStorage.getItem('trc_token');const $=id=>document.getElementById(id);let items=[];let filter='all';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function auth(){return {Authorization:'Bearer '+token,'Content-Type':'application/json'};}function stamp(v){const d=new Date(v);return isNaN(d)?'':d.toLocaleString();}
async function request(url,opts={}){const r=await fetch(url,{...opts,headers:{...auth(),...(opts.headers||{})}});if(r.status===401){localStorage.removeItem('trc_token');localStorage.removeItem('trc_user');location.href='/login.html?next=notifications';throw Error('Session expired');}const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.message||'Request failed');return data;}
function render(){const unread=items.filter(n=>!n.read).length;$('count').textContent=items.length+' notification'+(items.length===1?'':'s')+' · '+unread+' unread';const shown=items.filter(n=>filter==='all'||(filter==='unread'?!n.read:!!n.read));$('list').innerHTML=shown.length?shown.map(n=>'<article class="row '+(n.read?'read':'unread')+'" data-id="'+esc(n.id)+'" data-link="'+esc(n.link||'')+'"><span class="dot"></span><div style="min-width:0;flex:1"><div style="font-weight:600">'+esc(n.message||'Notification')+'</div><div class="muted" style="margin-top:6px">'+esc(n.type||'update')+' · '+esc(stamp(n.createdAt))+(n.read?'':' · Unread')+'</div></div></article>').join(''):'<div class="empty">'+(items.length?'Nothing in this filter.':'You have no notifications yet.')+'</div>';document.querySelectorAll('.row').forEach(el=>el.addEventListener('click',async()=>{const n=items.find(x=>x.id===el.dataset.id);if(n&&!n.read){try{await request('/api/notifications/'+encodeURIComponent(n.id)+'/read',{method:'PATCH'});n.read=true;}catch(e){alert(e.message);return;}}render();if(el.dataset.link)location.href=el.dataset.link;}));}
async function load(){if(!token){location.href='/login.html?next=notifications';return;}try{items=await request('/api/notifications');render();}catch(e){$('list').textContent=e.message;}}
$('markAll').addEventListener('click',async()=>{try{await request('/api/notifications/mark-all-read',{method:'POST'});items.forEach(n=>n.read=true);render();}catch(e){alert(e.message);}});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render();}));load();
</script></body></html>
