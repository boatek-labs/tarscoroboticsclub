<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events — TRC</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#071B11;color:#F1F5EE;font-family:'Inter',sans-serif;min-height:100vh}

    #nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,15,30,.93);
         backdrop-filter:blur(14px);border-bottom:1px solid #285438;height:60px;
         display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .nav-link{font-family:Rajdhani;font-weight:600;font-size:.88rem;letter-spacing:.08em;
              color:#BDCCBF;text-transform:uppercase;text-decoration:none;transition:.2s}
    .nav-link:hover,.nav-link.active{color:#E8BE16}

    #content{max-width:1000px;margin:0 auto;padding:88px 20px 60px}

    /* Event card */
    .evt-card{background:#0C2818;border:1px solid #285438;border-radius:4px;
              display:flex;gap:0;overflow:hidden;transition:.2s;margin-bottom:14px}
    .evt-card:hover{border-color:#E8BE1622;transform:translateX(4px)}
    .evt-date-col{width:80px;flex-shrink:0;display:flex;flex-direction:column;
                  align-items:center;justify-content:center;padding:20px 10px;border-right:1px solid #285438}
    .evt-day{font-family:Rajdhani;font-weight:700;font-size:2rem;line-height:1;color:#E8BE16}
    .evt-month{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:#77947D;text-transform:uppercase;letter-spacing:.1em}
    .evt-body{flex:1;padding:18px 20px}

    /* Type badges */
    .type-badge{font-family:'JetBrains Mono',monospace;font-size:.58rem;padding:2px 8px;
                border-radius:2px;display:inline-flex;align-items:center}
    .t-comp{background:#FF3B3015;color:#FF3B30;border:1px solid #FF3B3033}
    .t-workshop{background:#69A66A15;color:#69A66A;border:1px solid #69A66A33}
    .t-build{background:#F2CC2415;color:#F2CC24;border:1px solid #F2CC2433}
    .t-talk{background:#A855F715;color:#A855F7;border:1px solid #A855F733}
    .t-announce{background:#E8BE1615;color:#E8BE16;border:1px solid #E8BE1633}

    /* Announcement card */
    .announce-card{background:#0C2818;border:1px solid #E8BE1622;border-radius:4px;
                   padding:18px 20px;margin-bottom:12px;border-left:3px solid #E8BE16;transition:.2s}
    .announce-card:hover{background:#12351F}

    /* Filter */
    .filter-btn{font-family:Rajdhani;font-weight:600;font-size:.82rem;padding:6px 14px;
                border-radius:3px;border:1px solid #285438;color:#BDCCBF;background:transparent;
                cursor:pointer;transition:.2s}
    .filter-btn.active{background:#E8BE1615;color:#E8BE16;border-color:#E8BE1644}

    /* Section label */
    .sec-label{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:#77947D;
               text-transform:uppercase;letter-spacing:.16em;display:flex;align-items:center;gap:10px;
               margin:32px 0 16px}
    .sec-label::after{content:'';flex:1;height:1px;background:#285438}

    /* Countdown */
    .countdown{display:flex;gap:12px;margin-top:10px}
    .cd-block{background:#071B11;border:1px solid #285438;border-radius:3px;
              padding:6px 12px;text-align:center;min-width:52px}
    .cd-val{font-family:Rajdhani;font-weight:700;font-size:1.4rem;line-height:1;color:#E8BE16}
    .cd-lbl{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:#77947D;text-transform:uppercase}

    /* Next event hero */
    .next-hero{background:linear-gradient(135deg,#0C2818,#12351F);border:1px solid #F2CC2433;
               border-radius:4px;padding:28px;margin-bottom:32px;position:relative;overflow:hidden}

    .reveal{opacity:1;transform:none;}
  </style>
  <meta name="theme-color" content="#071B11" />
  <link rel="stylesheet" href="assets/trc-brand.css?v=20261123-4" />
</head>
<body>

<nav id="nav" class="trc-site-nav trc-page-nav">
  <a href="trc-home.html" style="display:flex;align-items:center;gap:8px;text-decoration:none">
    <span class="trc-nav-mark"><img class="trc-nav-seal" src="assets/trc-roundel.webp" alt="TARSCO Robotics Club roundel" /></span>
    <span style="font-family:Rajdhani;font-weight:700;font-size:1rem;color:#F1F5EE">TARSCO Robotics</span>
  </a>
  <div style="display:flex;align-items:center;gap:20px">
    <a href="learn.html"    class="nav-link">Learn</a>
    <a href="projects.html" class="nav-link">Projects</a>
    <a href="events.html"   class="nav-link active">Events</a>
    <a href="dashboard.html"class="nav-link">Dashboard</a>
  </div>
</nav>

<div id="content">

  <div style="margin-bottom:28px" class="reveal">
    <p style="font-family:'JetBrains Mono',monospace;font-size:.65rem;color:#77947D;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px">TRC Calendar</p>
    <h1 style="font-family:Rajdhani;font-weight:700;font-size:clamp(2rem,4vw,3rem);color:#F1F5EE">Events & Announcements</h1>
  </div>

  <!-- Next event hero -->
  <div class="next-hero reveal"><div class="next-event-kicker">Loading next event…</div></div>

  <!-- Filters -->
  <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap" class="reveal">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('competition',this)">Competitions</button>
    <button class="filter-btn" onclick="setFilter('workshop',this)">Workshops</button>
    <button class="filter-btn" onclick="setFilter('build',this)">Build Days</button>
    <button class="filter-btn" onclick="setFilter('talk',this)">Talks</button>
  </div>

  <!-- Upcoming events -->
  <div class="sec-label reveal">Upcoming Events</div>

  <div id="events-list"><div class="live-placeholder">Loading published events…</div></div>

  <!-- Announcements -->
  <div class="sec-label reveal">Announcements</div>

  </div>

<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}</style>

<script>
if (window.gsap && window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);
if (window.gsap && window.ScrollTrigger) gsap.utils.toArray('.reveal').forEach(el => {
  gsap.fromTo(el, {opacity:0, y:18}, {opacity:1, y:0, duration:.55, ease:'power2.out',
    scrollTrigger:{trigger:el, start:'top 92%', toggleActions:'play none none none'}});
});

// Countdown to July 14 2025 09:00
function updateCountdown() {
  const target = new Date('2025-07-14T09:00:00');
  const now    = new Date();
  const diff   = target - now;
  if(diff <= 0) { document.getElementById('countdown').innerHTML='<span style="color:#69A66A;font-family:Rajdhani;font-weight:700;font-size:1.2rem">Event is Live!</span>'; return; }
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  document.getElementById('cd-d').textContent = String(d).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown, 1000);

function setFilter(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.evt-card').forEach(c => {
    c.style.display = (type==='all' || c.dataset.type===type) ? '' : 'none';
  });
}
</script>
<script id="trc-live-events">
(async()=>{
 const list=document.getElementById('events-list'); if(!list)return;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 list.innerHTML='<p class="empty-state">Loading published events…</p>';
 try{
  const res=await fetch('/api/events');if(!res.ok)throw new Error('Could not load events');
  const items=await res.json();
  const upcoming=items.filter(x=>!x.date||new Date(x.date)>=new Date()).sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
  const hero=document.querySelector('.next-hero');
  const next=upcoming[0];
  if(hero){
   if(next){
    hero.innerHTML='<div class="next-event-kicker">NEXT EVENT</div><h2>'+esc(next.title||'Club event')+'</h2><p>'+esc(next.description||'')+'</p><div class="next-event-meta">'+(next.date?new Date(next.date).toLocaleString():'Date to be announced')+(next.location?' · '+esc(next.location):'')+'</div>';
   }else{
    hero.innerHTML='<div class="next-event-kicker">EVENTS</div><h2>No upcoming events</h2><p>New club events will appear here when they are published.</p>';
   }
  }
  document.querySelectorAll('.announce-card').forEach(card=>card.remove());
  if(!items.length){list.innerHTML='<div class="empty-state" style="padding:42px 20px;text-align:center;color:#9aab9e">There are no published events yet. New club events will appear here when announced.</div>';return;}
  list.innerHTML=items.map(x=>{
   const date=x.date?new Date(x.date):null,valid=date&&!Number.isNaN(date.getTime());
   const day=valid?String(date.getDate()).padStart(2,'0'):'—',month=valid?date.toLocaleString(undefined,{month:'short'}):'';
   return '<article class="evt-card reveal" data-type="'+esc((x.type||'event').toLowerCase())+'"><div class="evt-date-col"><div class="evt-day">'+day+'</div><div class="evt-month">'+month+'</div></div>'+
   '<div class="evt-body"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><span class="type-badge">'+esc(x.type||'Event')+'</span>'+
   (x.time?'<span>'+esc(x.time)+'</span>':'')+'</div><h3>'+esc(x.title||'Club event')+'</h3><p>'+esc(x.description||'')+'</p>'+
   '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:#9aab9e;font-size:.8rem">'+(x.location?'<span><i class="fa-solid fa-location-dot"></i> '+esc(x.location)+'</span>':'')+
   (x.audience?'<span>'+esc(x.audience)+'</span>':'')+'</div></div></article>';
  }).join('');
 }catch(err){list.innerHTML='<p class="empty-state">Events are temporarily unavailable.</p>';console.error(err);}
})();
</script>
</body>
</html>
