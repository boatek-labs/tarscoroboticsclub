<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/trc-roundel.webp"><title>My Projects — TRC</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#071b11;color:#f1f5ee;font-family:Inter,sans-serif}.wrap{max-width:1000px;margin:auto;padding:35px 18px}.muted{color:#91a895}.card{background:#0c2818;border:1px solid #285438;border-radius:12px;padding:18px;margin:12px 0}.btn{display:inline-block;background:#e8be16;color:#071b11;text-decoration:none;padding:9px 13px;border-radius:7px;font-weight:700}.status{font-size:.72rem;color:#e8be16;text-transform:uppercase}</style></head><body><nav style="padding:15px 20px;background:#0c2818;border-bottom:1px solid #285438"><a href="/dashboard.html" style="color:#e8be16;text-decoration:none">← Dashboard</a>　<a href="/members.html" style="color:#e8be16">Member directory</a></nav><main class="wrap"><h1 style="font:700 2.4rem Rajdhani;margin:0">My project workspace</h1><p class="muted">Projects you submitted or have joined as a teammate.</p><div id="status" class="muted">Loading projects…</div><section id="list"></section></main><script>const token=localStorage.getItem('trc_token'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{if(!token){location.href='/login.html';return;}try{const r=await fetch('/api/my/projects',{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();if(r.status===401){location.href='/login.html';return;}if(!r.ok)throw Error(d.message||'Could not load projects');$('status').textContent=d.length+' project'+(d.length===1?'':'s');$('list').innerHTML=d.length?d.map(p=>'<article class="card"><div class="status">'+esc(p.status)+'</div><h2 style="font:700 1.4rem Rajdhani;margin:5px 0">'+esc(p.title||'Untitled project')+'</h2><p class="muted">'+esc(p.description||'No description added.')+'</p><div class="muted">'+p.teamSize+' teammates · '+p.taskCount+' tasks</div><p><a class="btn" href="/project-workspace.html?id='+encodeURIComponent(p.id)+'">Open workspace →</a></p></article>').join(''):'<div class="card muted">You have not submitted or joined a project yet.</div>';}catch(e){$('status').textContent=e.message;}})();</script></body></html>
