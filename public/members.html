<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Directory — TARSCO Robotics</title><link rel="icon" href="/assets/trc-roundel.webp"><link rel="stylesheet" href="/assets/trc-brand.css?v=20261123-1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#071b11;color:#f1f5ee;font-family:Inter,sans-serif}.wrap{max-width:1100px;margin:auto;padding:96px 20px 50px}.muted{color:#9ab09d}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{background:#0c2818;color:#f1f5ee;border:1px solid #477452;border-radius:8px;padding:12px;font:inherit}.toolbar input{flex:1;min-width:210px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.card{background:#0c2818;border:1px solid #285438;border-radius:12px;padding:18px}.top{display:flex;gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:#285438;object-fit:cover;display:grid;place-items:center;color:#e8be16;font-weight:700}.role{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#e8be16}.card p{line-height:1.5;min-height:42px}.link{color:#e8be16;text-decoration:none}.empty{padding:35px;text-align:center;color:#9ab09d}
</style></head><body><nav class="trc-site-nav trc-page-nav"><a href="/dashboard.html">TARSCO Robotics</a><div><a href="/dashboard.html">Dashboard</a>　<a href="/activity.html">Activity</a>　<a href="/calendar.html">Calendar</a>　<a href="/profile.html">Profile</a></div></nav><main class="wrap"><h1 style="font:700 2.5rem Rajdhani;margin:0">Member directory</h1><p class="muted">Find club members, executives and collaborators.</p><div class="toolbar"><input id="search" type="search" placeholder="Search by name, role or bio…" aria-label="Search members"><select id="role"><option value="">All roles</option><option value="member">Members</option><option value="executive">Executives</option><option value="superadmin">Administrators</option></select></div><div id="status" class="muted">Loading members…</div><section id="grid" class="grid"></section></main><script>
const token=localStorage.getItem('trc_token'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer;async function load(){if(!token){location.href='/login.html?next=members';return;}const q=$('search').value.trim(),role=$('role').value;$('status').textContent='Loading…';try{const r=await fetch('/api/members?'+new URLSearchParams({q,role}),{headers:{Authorization:'Bearer '+token}});if(r.status===401){localStorage.removeItem('trc_token');location.href='/login.html?next=members';return;}const data=await r.json();if(!r.ok)throw Error(data.message||'Could not load directory');$('status').textContent=data.length+' club '+(data.length===1?'member':'members');$('grid').innerHTML=data.length?data.map(m=>'<article class="card"><div class="top">'+(m.avatar?'<img class="avatar" alt="" src="'+esc(m.avatar)+'">':'<div class="avatar">'+esc((m.name||'?').charAt(0).toUpperCase())+'</div>')+'<div><strong>'+esc(m.name)+'</strong><div class="role">'+esc(m.role)+'</div></div></div><p class="muted">'+esc(m.bio||'No bio added yet.')+'</p><div class="muted">'+m.badges+' badges</div><p><a class="link" href="/messages.html?user='+encodeURIComponent(m.id)+'">Message member →</a></p></article>').join(''):'<div class="empty">No members match your search.</div>';}catch(e){$('status').textContent=e.message;}}$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250)});$('role').addEventListener('change',load);load();
</script></body></html>
